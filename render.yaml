services:
  - type: web
    name: mision-andina
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/mision_andina.sqlite
    disk:
      name: mision-andina-data
      mountPath: /var/data
      sizeGB: 1
